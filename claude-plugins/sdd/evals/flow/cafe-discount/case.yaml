schema_version: "1"
name: flow-cafe-discount
description: sdd:flow 가 골든 요구사항 문서로 화면흐름 문서를 flow 규칙대로 쓰는지 본다.
tags: [sdd, flow]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /sdd:flow out/requirements.md 화면흐름 문서는 같은 폴더의 out/flow.md 에 쓴다.

    평가용 실행이라 아래를 지킨다.
    - 이 폴더에는 코드와 와이어프레임이 없다. git fetch 와 origin/main 조사는 하지 않고, 지금 화면 이름은 요구사항 문서의 「기존 시스템과 맞닿는 곳」에서 가져오고 확인하지 못한 것은 @가정 으로 쓴다.
    - 나에게 묻지 않는다. 열린 결정은 열린 채로 추천안을 적어 두고 끝까지 쓴다.
    - mermaid-cli 렌더링과 윤문(humanize-korean) 단계는 건너뛴다.
    - 같은 이름의 파일이 이미 있으면 묻지 말고 새로 쓴다.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Write, Edit, Glob, Grep, Bash, Skill]
runs: 3
graders:
  - type: file_exists
    name: file-output
    path: out/flow.md
  - type: tool_used
    name: ask-none
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
  - type: regex
    name: regex-path-flowchart-lr
    target: {source: file, path: out/flow.md}
    pattern: '#### 경로[^`]*```mermaid\s*\n\s*flowchart LR'
    match: contains
  - type: regex
    name: regex-flow-flowchart-td
    target: {source: file, path: out/flow.md}
    pattern: '```mermaid\s*\n\s*flowchart TD'
    match: contains
  - type: regex
    name: regex-classdef-asis
    target: {source: file, path: out/flow.md}
    pattern: 'classDef asis fill:#eeeeee,stroke:#9e9e9e,color:#333333'
    match: contains
  - type: regex
    name: regex-classdef-add
    target: {source: file, path: out/flow.md}
    pattern: 'classDef add fill:#d4f5dd,stroke:#2e7d32,color:#1b5e20'
    match: contains
  - type: regex
    name: regex-classdef-mod
    target: {source: file, path: out/flow.md}
    pattern: 'classDef mod fill:#fff1cc,stroke:#e0a100,color:#5d4300'
    match: contains
  - type: regex
    name: regex-screen-table-header
    target: {source: file, path: out/flow.md}
    pattern: '^\| 요소 \| 바뀜 \| 보여 줄 값과 동작 \| 언제 보이나 \| 근거 \|$'
    flags: m
    match: contains
  - type: regex
    name: regex-decision-letters
    target: {source: file, path: out/flow.md}
    pattern: '\*\*[A-LS-Z][0-9]+\. '
    match: not_contains
  - type: regex
    name: regex-no-summary-heading
    target: {source: file, path: out/flow.md}
    pattern: '^#+ .*(요약|결론)'
    flags: m
    match: not_contains
  - type: llm
    name: llm-user-visible-only
    focus: {source: file, path: out/flow.md}
    criteria: |
      흐름도는 경로 하나와 흐름별로 나뉜 여러 코드 블록이다. 흐름도와 화면 표에 저장·결제 뒤 서버가 따지는 순서, 기록, API 호출 노드가 없고, 행동 뒤에는 사용자가 보는 결과 화면(성공, 오류 문구, 안내)으로 바로 잇는다. 모든 노드에 asis·add·mod 중 하나가 붙어 있고, 지금 화면(회색) 사이에 새 노드가 끼어드는 모양이다. 모두 맞으면 PASS.
  - type: llm
    name: llm-write-once
    focus: {source: file, path: out/flow.md}
    criteria: |
      요구사항 문서의 규칙·수치(할인 한도 1,500원, 분담 비율 등)를 옮겨 적지 않고 "요구사항 1 조건 2" 처럼 근거 칸에서 가리킨다. 값·문구·조건은 화면 표 한 곳에만 있고 흐름도 노드에는 요소 이름과 짧은 상태만 있다. 인증 안내 표시(요구사항 1 인수 조건 2)처럼 화면에 보이는 인수 조건이 어느 표의 근거 칸이나 범위 밖에 있다. 요구사항에 없는 화면 세부에는 @초안 이 붙어 있다. 모두 맞으면 PASS.
expected_outcome: out/flow.md 에 화면 묶음마다 경로(flowchart LR)와 흐름별 흐름도(flowchart TD)가 AS-IS·TO-BE 색으로 나뉘어 있고, 바뀌는 화면마다 요소·바뀜·보여 줄 값과 동작·언제 보이나·근거 표가 있다.
